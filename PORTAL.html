<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>AI-PNAS Medical AI Dashboard</title>

<style>
/* ===== GLOBAL STYLE ===== */
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  font-family: Arial, sans-serif;
}

body {
  background: linear-gradient(135deg, #071a23, #12343a);
  color: white;
  min-height: 100vh;
  overflow-x: hidden;
}

/* ===== HEADER ===== */
header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 16px;
  padding: 16px 24px;
  background: rgba(255,255,255,0.05);
  backdrop-filter: blur(10px);
  border-bottom: 1px solid rgba(255,255,255,0.1);
}

header h1 {
  font-size: 24px;
  background: linear-gradient(90deg, #f4c430, #22c55e);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
}

/* ===== CONTAINER ===== */
.container {
  display: grid;
  grid-template-columns: 260px 1fr;
  min-height: 100vh;
}

.brand {
  display: flex;
  align-items: center;
  gap: 12px;
}

.brand img {
  width: 48px;
  height: 48px;
  padding: 3px;
  border: 3px solid transparent;
  border-radius: 14px;
  background: linear-gradient(#fff, #fff) padding-box, linear-gradient(135deg, #d62828 0 33%, #f4c430 33% 66%, #168a45 66%) border-box;
}

/* ===== SIDEBAR ===== */
.sidebar {
  background: rgba(255,255,255,0.03);
  padding: 20px;
  border-right: 1px solid rgba(255,255,255,0.1);
}

.sidebar h2 {
  margin-bottom: 20px;
  font-size: 18px;
  color: #93c5fd;
}

.nav-item {
  padding: 12px;
  margin: 10px 0;
  background: rgba(255,255,255,0.05);
  border-radius: 10px;
  cursor: pointer;
  transition: 0.3s;
}

.nav-item:hover {
  background: #0f766e;
}

.nav-item a {
  color: inherit;
  text-decoration: none;
}

/* ===== MAIN ===== */
.main {
  padding: 25px;
}

/* ===== CARDS ===== */
.cards {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
  gap: 20px;
}

.card {
  background: rgba(255,255,255,0.05);
  padding: 20px;
  border-radius: 15px;
  backdrop-filter: blur(10px);
  border: 1px solid rgba(255,255,255,0.1);
  transition: 0.3s;
}

.card:hover {
  transform: translateY(-5px);
  background: rgba(255,255,255,0.08);
}

.card h3 {
  color: #93c5fd;
}

.card p {
  font-size: 22px;
  margin-top: 10px;
  font-weight: bold;
}

/* ===== FORM ===== */
.form {
  margin-top: 30px;
  background: rgba(255,255,255,0.05);
  padding: 20px;
  border-radius: 15px;
}

input {
  width: 100%;
  padding: 12px;
  margin: 10px 0;
  border-radius: 10px;
  border: none;
  outline: none;
}

input:focus {
  box-shadow: 0 0 0 3px rgba(45, 212, 191, 0.28);
}

button {
  padding: 12px 20px;
  border: none;
  border-radius: 10px;
  background: linear-gradient(90deg, #2563eb, #7c3aed);
  color: white;
  cursor: pointer;
  transition: 0.3s;
}

button:hover {
  transform: scale(1.05);
}

/* ===== RESULT BOX ===== */
.result {
  margin-top: 20px;
  padding: 15px;
  background: rgba(0,0,0,0.3);
  border-left: 4px solid #22c55e;
  border-radius: 10px;
}

.result.error {
  border-left-color: #ef4444;
}

@media (max-width: 760px) {
  header { align-items: flex-start; flex-direction: column; }
  header h1 { font-size: 21px; }
  .container { display: block; }
  .sidebar { border-right: 0; border-bottom: 1px solid rgba(255,255,255,0.1); }
  .sidebar h2 { margin-bottom: 10px; }
  .nav-item { display: inline-block; margin: 4px 4px 4px 0; padding: 9px; }
  .main { padding: 18px; }
}
</style>
</head>

<body>

<header>
  <div class="brand">
    <img src="public/logo-aipnas.svg" alt="AI-PNAS logo" />
    <h1>AI-PNAS Care Portal</h1>
  </div>
  <a href="/login" class="nav-item">Sign in</a>
</header>

<div class="container">

  <!-- SIDEBAR -->
  <div class="sidebar">
    <h2>Navigation</h2>
    <div class="nav-item"><a href="#dashboard">Dashboard</a></div>
    <div class="nav-item"><a href="#register">Register Child</a></div>
    <div class="nav-item"><a href="/children">Children</a></div>
    <div class="nav-item"><a href="/services">Services</a></div>
    <div class="nav-item"><a href="/about">About</a></div>
  </div>

  <!-- MAIN -->
  <div class="main">

    <!-- CARDS -->
    <div id="dashboard" class="cards">
      <div class="card">
        <h3>Total Children</h3>
        <p>--</p>
      </div>

      <div class="card">
        <h3>High Risk</h3>
        <p>--</p>
      </div>

      <div class="card">
        <h3>Normal</h3>
        <p>--</p>
      </div>
    </div>

    <!-- FORM -->
    <div id="register" class="form">
      <h2>Register Child (AI Analysis)</h2>

      <input id="name" placeholder="Child Name" autocomplete="off" required/>
      <input id="age" type="number" min="0" max="60" step="1" placeholder="Age (months)" required/>
      <input id="weight" type="number" min="0.1" step="0.1" placeholder="Weight (kg)" required/>
      <input id="height" type="number" min="10" step="0.1" placeholder="Height (cm)" required/>
      <input id="muac" type="number" min="1" step="0.1" placeholder="MUAC (cm)" required/>

      <button onclick="analyze()">Run AI Analysis</button>

      <div id="result" class="result" style="display:none;"></div>
    </div>

  </div>
</div>

<script>
function analyze() {
  const name = document.getElementById("name").value.trim();
  const age = Number(document.getElementById("age").value);
  const weight = Number(document.getElementById("weight").value);
  const height = Number(document.getElementById("height").value);
  const muac = Number(document.getElementById("muac").value);
  const resultBox = document.getElementById("result");

  resultBox.classList.remove("error");
  if (!name || !Number.isFinite(age) || !Number.isFinite(weight) || !Number.isFinite(height) || !Number.isFinite(muac) || age > 60 || age < 0 || weight <= 0 || height <= 0 || muac <= 0) {
    resultBox.classList.add("error");
    resultBox.style.display = "block";
    resultBox.textContent = "Enter valid child measurements before running the assessment.";
    return;
  }

  let status = "";

  if (muac < 11.5) status = "🔴 Severe Acute Malnutrition (SAM)";
  else if (muac < 12.5) status = "🟠 Moderate Acute Malnutrition (MAM)";
  else status = "🟢 Normal Nutrition";

  resultBox.style.display = "block";
  resultBox.replaceChildren();
  const title = document.createElement("h3");
  title.textContent = `Assessment for ${name}`;
  const details = document.createElement("p");
  details.textContent = `Age: ${age} months | Weight: ${weight} kg | Height: ${height} cm | MUAC: ${muac} cm`;
  const outcome = document.createElement("h2");
  outcome.textContent = status;
  resultBox.append(title, details, document.createElement("hr"), outcome);
}
</script>

</body>
</html>
